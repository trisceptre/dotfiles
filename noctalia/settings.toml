config_version = 7

[bar.default]
end = [ "tray", "notifications", "network", "volume", "control-center" ]
margin_ends = 0
start = [ "workspaces" ]

[control_center]
hidden_tabs = [
    "media",
    "audio",
    "monitor",
    "power",
    "network",
    "bluetooth",
    "weather",
    "calendar",
    "notifications",
    "screen-time"
]
shortcuts = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[shell.panel]
open_near_click_control_center = true

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = false
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[theme]
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/gen/Pictures/Wallpapers/starry.jpg"

    [wallpaper.last]
    path = "/home/gen/Pictures/Wallpapers/starry.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/gen/Pictures/Wallpapers/starry.jpg"

[widget.clock]
format = "{:%H:%M %p}"

[widget.control-center]
glyph = "power"
