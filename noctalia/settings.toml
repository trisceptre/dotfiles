config_version = 14

[bar.default]
end = [ "tray", "notifications", "network", "volume", "control-center" ]
margin_ends = 0
start = [ "workspaces" ]

[control_center]
hidden_tabs = [ "media", "monitor", "power", "bluetooth", "weather", "screen-time" ]
shortcuts = []

[lockscreen]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 889.5
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
layer = "overlay"
offset_y = 20
scale = 0.90000000596046448

[osd]
position = "top_right"

    [osd.kinds]
    keyboard_layout = false
    lock_keys = false
    media = false
    nightlight = false
    power_profile = false
    privacy = false

[shell]
font_family = "JetBrainsMono Nerd Font"
settings_show_advanced = false

    [shell.panel]
    open_near_click_control_center = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
transition = [ "fade" ]

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/space.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/space.jpg"

    [wallpaper.monitors.DP-2]
    path = "~/Pictures/Wallpapers/space.jpg"

[weather]
enabled = false

[widget.clock]
format = "{:%-I:%M %p}"

[widget.control-center]
glyph = "power"